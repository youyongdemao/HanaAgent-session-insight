<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Insight 设置</title>
  <!-- 主题不在这里加载：交给 assets/theme-sync.js 跟随宿主（宿主签发的样式表 + SDK 订阅）。
       光读 iframe URL 里那份 hana-css 会停在创建时的初值上，显示成默认主题。 -->
  <link rel="stylesheet" href="./assets/settings.css">
  <link rel="stylesheet" href="./assets/update-notice.css">
</head>
<body class="is-settings" data-hana-theme="inherit">
  <div class="st-page">

    <section class="st-block">
      <h1 class="st-block-title">界面设置</h1>

      <section class="st-section">
        <h2>本轮速览</h2>
        <ul class="st-list" id="stList"></ul>
      </section>

      <section class="st-section">
        <h2>实时用量</h2>
        <ul class="st-list" id="wTableBody"></ul>
      </section>

      <div class="st-actions">
        <button class="st-btn st-btn-primary" id="stSave">保存</button>
        <button class="st-btn" id="stReset">恢复默认</button>
        <span class="st-status" id="stStatus"></span>
      </div>
    </section>

    <section class="st-block" id="stLocalBlock" hidden>
      <h1 class="st-block-title">供应商设置</h1>
      <section class="st-section">
        <ul class="st-list" id="stLocalList"></ul>
      </section>
      <div class="st-actions">
        <span class="st-status" id="stLocalStatus"></span>
      </div>
    </section>

    <section class="st-block">
      <h1 class="st-block-title">关于</h1>
      <section class="st-section">
        <ul class="st-list">
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">版本</div>
            </div>
            <div class="st-item-ctl">
              <span class="st-item-value" id="aboutVersion">v–</span>
              <button class="st-btn st-btn-sm" id="aboutUpdate" type="button">更新</button>
            </div>
          </li>
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">GitHub</div>
            </div>
            <div class="st-item-ctl">
              <a class="st-item-link" id="aboutGithub" href="https://github.com/youyongdemao" rel="noopener noreferrer">github.com/youyongdemao</a>
            </div>
          </li>
        </ul>
      </section>
    </section>

  </div>

  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
