<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会话用量 设置</title>
  <!-- 主题不在这里加载：交给 assets/theme-sync.js 跟随宿主（宿主签发的样式表 + SDK 订阅）。
       光读 iframe URL 里那份 hana-css 会停在创建时的初值上，显示成默认主题。 -->
  <link rel="stylesheet" href="./assets/settings.css">
  <link rel="stylesheet" href="./assets/update-notice.css">
</head>
<body class="is-settings" data-hana-theme="inherit">
  <div class="st-page">

    <section class="st-block">
      <h1 class="st-block-title">界面设置</h1>

      <section class="st-section">
        <h2>本轮速览</h2>
        <ul class="st-list" id="stList"></ul>
        <div class="st-actions">
          <span class="st-status" id="stStatusLive"></span>
          <button class="st-btn st-btn-primary" id="stSaveLive">保存</button>
          <button class="st-btn" id="stResetLive">恢复默认</button>
        </div>
      </section>

      <section class="st-section">
        <h2>实时用量</h2>
        <ul class="st-list" id="wTableBody"></ul>
        <div class="st-actions">
          <span class="st-status" id="stStatusWidget"></span>
          <button class="st-btn st-btn-primary" id="stSaveWidget">保存</button>
          <button class="st-btn" id="stResetWidget">恢复默认</button>
        </div>
      </section>

      <section class="st-section">
        <h2>工作台首页</h2>
        <div class="st-forms" id="stHomeView">
          <label class="st-form" data-v="usage">
            <input class="st-radio" type="radio" name="homeView" value="usage">
            <span class="st-form-head"><b>用量</b><i>Token、费用、缓存命中与各类图表</i></span>
            <span class="st-demo" aria-hidden="true">
              <span class="d-hero"></span>
              <span class="d-kpis"><em></em><em></em><em></em></span>
              <svg class="d-line" viewBox="0 0 100 28" preserveAspectRatio="none">
                <path d="M0 22 L14 16 L28 19 L42 9 L56 13 L70 6 L84 11 L100 4" />
              </svg>
              <span class="d-row"></span>
              <span class="d-row short"></span>
            </span>
          </label>
          <label class="st-form" data-v="api">
            <input class="st-radio" type="radio" name="homeView" value="api">
            <span class="st-form-head"><b>API 管理</b><i>总消耗与余额、供应商额度查询</i></span>
            <span class="st-demo" aria-hidden="true">
              <span class="d-duo"><em></em><em class="alt"></em></span>
              <span class="d-list">
                <span class="d-li"><i></i><b></b></span>
                <span class="d-li"><i></i><b class="short"></b></span>
                <span class="d-li"><i></i><b></b></span>
              </span>
            </span>
          </label>
        </div>
        <div class="st-actions">
          <span class="st-status" id="stStatusHome"></span>
          <button class="st-btn st-btn-primary" id="stSaveHome">保存</button>
        </div>
      </section>
    </section>

    <section class="st-block" id="stLocalBlock" hidden>
      <h1 class="st-block-title">供应商设置</h1>
      <section class="st-section">
        <ul class="st-list" id="stLocalList"></ul>
      </section>
      <div class="st-actions">
        <span class="st-status" id="stLocalStatus"></span>
      </div>
    </section>

    <section class="st-block">
      <h1 class="st-block-title">关于</h1>
      <section class="st-section">
        <ul class="st-list">
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">版本</div>
            </div>
            <div class="st-item-ctl">
              <span class="st-item-value" id="aboutVersion">v–</span>
              <button class="st-btn st-btn-sm" id="aboutUpdate" type="button">更新</button>
            </div>
          </li>
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">GitHub</div>
            </div>
            <div class="st-item-ctl">
              <a class="st-item-link" id="aboutGithub" href="https://github.com/youyongdemao" rel="noopener noreferrer">github.com/youyongdemao</a>
            </div>
          </li>
        </ul>
      </section>
    </section>

  </div>

  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
