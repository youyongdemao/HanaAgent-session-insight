<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Insight 设置</title>
  <script>
    // 初始主题：宿主只在主题“变化”时推送，不推初始值（renderer 首次订阅回调被跳过），
    // 所以页面必须自己从 hana-css 参数加载一次，之后由 SDK 跟随变化。
    (() => {
      const advertisedUrl = new URLSearchParams(window.location.search).get("hana-css");
      if (!advertisedUrl) return;
      try {
        const stylesheetUrl = new URL(advertisedUrl, window.location.href);
        if (
          stylesheetUrl.origin !== window.location.origin ||
          (stylesheetUrl.protocol !== "http:" && stylesheetUrl.protocol !== "https:") ||
          stylesheetUrl.pathname !== "/api/apps/theme.css" ||
          !stylesheetUrl.searchParams.get("theme") ||
          stylesheetUrl.username ||
          stylesheetUrl.password ||
          stylesheetUrl.hash
        ) {
          throw new Error("invalid Hana theme stylesheet URL");
        }
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = stylesheetUrl.href;
        document.head.appendChild(link);
      } catch (error) {
        console.warn("[session-insight] 无法加载 Hana 主题样式", error);
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/settings.css">
</head>
<body data-hana-theme="inherit">
  <div class="st-page">

    <section class="st-section">
      <h2>本轮速览</h2>
      <p class="st-desc">
        输入栏下方那五项，开关决定显示与否。<strong>默认五项全开</strong>；关掉的项不再出现在输入栏里。
      </p>
      <div class="st-table-wrap">
        <table class="st-table">
          <thead>
            <tr>
              <th scope="col">显示项</th>
              <th scope="col">说明</th>
              <th scope="col" class="st-col-sw">显示</th>
            </tr>
          </thead>
          <tbody id="stList"></tbody>
        </table>
      </div>
      <div class="st-actions">
        <button class="st-btn st-btn-primary" id="stSave">保存</button>
        <button class="st-btn" id="stReset">恢复默认</button>
        <span class="st-status" id="stStatus"></span>
      </div>
    </section>

    <section class="st-section">
      <h2>实时用量</h2>
      <p class="st-desc">
        「实时用量」卡片内的各区块，开关决定显示与否。<strong>默认全部显示</strong>。
      </p>
      <div class="st-table-wrap">
        <table class="st-table">
          <thead>
            <tr>
              <th scope="col">区块</th>
              <th scope="col">说明</th>
              <th scope="col" class="st-col-sw">显示</th>
            </tr>
          </thead>
          <tbody id="wTableBody"></tbody>
        </table>
      </div>
      <div class="st-actions">
        <button class="st-btn st-btn-primary" id="wSave">保存</button>
        <button class="st-btn" id="wReset">恢复默认</button>
        <span class="st-status" id="wStatus"></span>
      </div>
    </section>

  </div>
  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
