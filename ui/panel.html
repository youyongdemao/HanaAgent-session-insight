<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会话用量</title>
  <script>
    // 初始主题：宿主只在主题“变化”时推送、不推初始值，页面需自行从 hana-css 加载一次。
    (() => {
      const advertisedUrl = new URLSearchParams(window.location.search).get("hana-css");
      if (!advertisedUrl) return;
      try {
        const stylesheetUrl = new URL(advertisedUrl, window.location.href);
        if (
          stylesheetUrl.origin !== window.location.origin ||
          (stylesheetUrl.protocol !== "http:" && stylesheetUrl.protocol !== "https:") ||
          stylesheetUrl.pathname !== "/api/apps/theme.css" ||
          !stylesheetUrl.searchParams.get("theme") ||
          stylesheetUrl.username ||
          stylesheetUrl.password ||
          stylesheetUrl.hash
        ) {
          throw new Error("invalid Hana theme stylesheet URL");
        }
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = stylesheetUrl.href;
        document.head.appendChild(link);
      } catch (error) {
        console.warn("[session-insight] 无法加载 Hana 主题样式", error);
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/panel-v2.css">
</head>
<body data-hana-theme="inherit" data-surface="page">
  <div id="root" data-surface="page"></div>
  <script>
    window.addEventListener("error", function (e) {
      var root = document.getElementById("root");
      if (root && !root.innerHTML) {
        root.innerHTML = '<div class="empty">面板加载失败：' + (e.message || "脚本错误") + "</div>";
      }
    });
  </script>
  <script type="module" src="./assets/panel-v2.js"></script>
</body>
</html>
